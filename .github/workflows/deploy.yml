name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      placeholder:
        description: "Deploy an empty placeholder page instead of the vault (used once, before Cloudflare Access is set up)"
        type: boolean
        default: false

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  PROJECT_NAME: vault-site

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Check out vault
        if: ${{ !inputs.placeholder }}
        uses: actions/checkout@v4
        with:
          repository: TaylorBurke/zero-vault-thirty
          token: ${{ secrets.VAULT_TOKEN }}
          path: vault

      - name: Copy notes into content/
        if: ${{ !inputs.placeholder }}
        run: rsync -a --exclude .git --exclude .github --exclude .obsidian --exclude .gitignore vault/ content/

      - uses: actions/setup-node@v4
        if: ${{ !inputs.placeholder }}
        with:
          node-version-file: .node-version
          cache: npm

      - name: Build site
        if: ${{ !inputs.placeholder }}
        run: |
          npm ci
          npx quartz build

      - name: Build placeholder
        if: ${{ inputs.placeholder }}
        run: mkdir -p public && echo '<!doctype html><title>Nothing here</title>' > public/index.html

      # Fails harmlessly once the project exists
      - name: Create Cloudflare Pages project
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create ${{ env.PROJECT_NAME }} --production-branch=main

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=${{ env.PROJECT_NAME }} --branch=main
